{% extends 'base.html' %}
{% load static %}
{% block content %}
  <form method="post"
        enctype="multipart/form-data"
        id="upload-form"
        action="{% url 'sortIT:upload' imageset.id %}">
    {% csrf_token %}
    <div class="form-group m-3 container">
      <h4>
        Upload to <b>{{ imageset.name }}</b>
      </h4>
      <div class="input-group my-3">
        <label class="input-group-text btn btn-primary"
               for="image-dir"
               style="width: 15%">
          Folders
        </label>
        <input type="file"
               class="form-control"
               name="image-dir"
               id="image-dir"
               accept="image/png, image/jpeg"
               multiple
               webkitdirectory />
      </div>
      <div class="input-group">
        <label class="input-group-text btn btn-primary"
               for="image"
               style="width: 15%">
          Files
        </label>
        <input type="file"
               class="form-control"
               name="image"
               id="image"
               accept="image/png, image/jpeg"
               multiple />
      </div>
      <div class="m-2" id="dropzone-div">
        <div class="dropzone"
             id="dropzone"
             style="border: 2px dashed #000000;
                    padding: 70px;
                    margin: 15px;
                    font-size: 22px;
                    color: #000000;
                    background-color: #ffffff;
                    text-align: center">
          Drop files or folder here
        </div>
      </div>
      <div class="m-2" id="bottom-btns">
        <button type="button" id="clear-button" class="btn btn-outline-secondary">
          Clear
        </button>
        <button type="submit" id="upload-button" class="btn btn-primary">
          Upload
        </button>
        <p class="m-2 text-muted">
          *supported browsers: Chrome/Edge
        </p>
      </div>
      <div id="progress-container" hidden>
        <div class="progress my-5" style="height: 25px;">
          <div id="progress-bar"
               class="progress-bar progress-bar-striped progress-bar-animated bg-info"
               role="progressbar"
               style="width: 0%"
               aria-valuenow="0"
               aria-valuemax="100">
          </div>
        </div>
      </div>
    </div>
  </form>
  <script type="text/javascript">
    var dropzone = document.getElementById("dropzone");
    var image = document.getElementById("image");
    var imageDir = document.getElementById("image-dir")
    var uploadButton = document.getElementById("upload-button");
    var uploadForm = document.getElementById("upload-form");
    var progressBar = document.getElementById("progress-bar");
    var progressContainer = document.getElementById("progress-container");
    var clearButton = document.getElementById("clear-button");
    var bottomButtons = document.getElementById("bottom-btns");
    var dropzoneDiv = document.getElementById("dropzone-div");
    const BATCH_SIZE = 256;
    let cumulativeLoaded = 0;
    let totalSize = 0;

    dropzone.ondragover = function(e) {
      e.preventDefault();
      this.style.backgroundColor = "#b3e6ff";
      this.className = "dropzone dragover";
      return false;
    };

    dropzone.ondragleave = function(e) {
      e.preventDefault();
      this.className = "dropzone";
      this.style.backgroundColor = "";
      return false;
    };

    dropzone.ondrop = async (e) => {
      e.preventDefault();

      this.className = "dropzone";

      var items = e.dataTransfer.items; // get dropped items
      var newFileList = new DataTransfer();
      var imageCount = 0;

      for (var i = 0; i < image.files.length; i++) {
        newFileList.items.add(image.files[i]);
        imageCount++;
      }

      var imageRegex = /^image\/(png|jpg|jpeg)$/;

      var addFileIfUnique = (file) => {
        var itemsArray = Array.from(newFileList.items);
        var isDuplicate = itemsArray.some(
          (item) => item.getAsFile().name == file.name,
        );
        if (!isDuplicate) {
          newFileList.items.add(file);
          imageCount++;
        }
      };
      for (var item of items) {
        var file = item.getAsFile();
        if (imageRegex.test(file.type)) {
          addFileIfUnique(file);
        } else if (file.type == "") {
          var entry = item.webkitGetAsEntry();

          async function getEntries(folder) {
            var reader = folder.createReader();
            var entries = [];
            while (true) {
              try {
                var results = await new Promise((resolve, reject) => {
                  reader.readEntries(resolve, reject);
                });
                if (results.length) {
                  entries = entries.concat(results);
                } else {
                  break;
                }
              } catch (error) {
                console.log(error);
                throw error;
              }
            }
            return entries;
          }

          async function addFolderImages(folder) {
            for (var entry of folder) {
              if (entry.isFile) {
                var file = await new Promise((resolve, reject) => {
                  entry.file(resolve, reject);
                });
                if (imageRegex.test(file.type)) {
                  addFileIfUnique(file);
                }
              } else if (entry.isDirectory) {
                var subfolder = await getEntries(entry);
                await addFolderImages(subfolder);
              }
            }
          }
          try {
            var folder = await getEntries(entry);
            await addFolderImages(folder);
          } catch (error) {
            console.error(error);
          }
        } else {
          alert("Please drop only image files or folders.");
        }
      }
      console.log(newFileList);
      image.files = newFileList.files;
      dropzone.style.backgroundColor = "";
      console.log("Number of images: " + imageCount);
    };

    function uploadBatch(formData, onBatchComplete) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        xhr.upload.onprogress = function(e) {
          cumulativeLoaded += e.loaded;
          const percent = Math.round(Math.min((cumulativeLoaded / totalSize) * 100, 100));
          progressBar.style.width = percent.toString() + "%";
          progressBar.setAttribute("aria-valuenow", percent);
          if (percent < 100) {
            progressBar.innerHTML = `Uploading: ${percent}%`;
          } else {
            progressBar.innerHTML = "Done!";
          }
        };

        xhr.onload = function() {
          if (xhr.status === 200) {
            if (onBatchComplete) onBatchComplete();
            resolve();
          } else {
            reject(`Batch failed: ${xhr.status}`);
          }
        };
        xhr.onerror = () => reject('Network error');
        xhr.onabort = () => reject('Upload aborted');

        xhr.open("POST", uploadForm.action);
        xhr.send(formData);
      });
    }

    async function uploadAllFiles(files) {
      totalSize = files.reduce((acc, f) => acc + f.size, 0);
      for (let i = 0; i < files.length; i += BATCH_SIZE) {
        const batch = files.slice(i, i + BATCH_SIZE);
        const formData = new FormData(uploadForm);
        formData.delete("image");
        formData.delete("image-dir");
        batch.forEach((f) => formData.append("image", f, f.name));

        await uploadBatch(formData, () => {
          // progress updated in onprogress
        });
      }
      window.location.href = "/sortIT/";
    }

    uploadButton.onclick = function(e) {
      e.preventDefault();

      if (image.files.length > 0 || imageDir.files.length > 0) {
        progressContainer.hidden = false;
        bottomButtons.hidden = true;
        dropzoneDiv.hidden = true;
        const allFiles = [...image.files, ...imageDir.files];
        uploadAllFiles(allFiles).catch(err => {
          progressBar.innerHTML = err;
          console.error(err);
        });
      } else {
        alert("Please drop some image files first.");
      }
    };

    clearButton.onclick = function() {
      image.files = new DataTransfer().files;
      imageDir.files = new DataTransfer().files;
      progressContainer.hidden = true;
    };
  </script>
{% endblock %}
