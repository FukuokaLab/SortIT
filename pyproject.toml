[project]
name = "sortit"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "django>=6.0.6",
  "gunicorn>=26.0.0",
  "pillow>=12.2.0",
  "python-dotenv>=1.2.2",
  "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
  "django-stubs>=6.1.0",
  "ipython>=9.16.1",
]

[tool.djlint]
indent = 2
format_js = true
format_css = true
line_break_after_multiline_tag = true
css.indent_size = 2
js.indent_size = 2

[tool.pyrefly]
project-includes = [
  "**/*.py*",
  "**/*.ipynb",
]

[tool.ruff]
lint.ignore = ["RUF012"]
