[project]
name = "clustercleaner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.8",
    "django-admin-thumbnails>=0.2.9",
    "django-widgets-improved>=1.5.0",
    "gunicorn>=23.0.0",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
]

[tool.pyright]
typeCheckingMode = "basic"

[tool.djlint]
indent=2
format_js=true
format_css=true
line_break_after_multiline_tag=true

[tool.djlint.js]
indent_size=2

[tool.djlint.css]
indent_size=2
