<!DOCTYPE html>
{% load static %}
<html lang='en'
      data-bs-theme="{% if dark_mode %}dark{% else %}light{% endif %}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SortIT</title>
    <!-- css -->
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <style>
      [data-bs-theme="dark"] img[src$=".svg"] {
        filter: invert(1) brightness(2);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <header>
        <nav class="navbar navbar-expand-sm bg-body-tertiary">
          <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'sortIT:choose_proj' %}">SortIT</a>
            {% if user.is_authenticated %}
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                  {% if user.is_staff %}
                    <li class="nav-item">
                      <a class="nav-link active" href="/admin" target="admin_subwindow">
                        <img src="{% static 'setting.svg' %}">
                      Admin</a>
                    </li>
                  {% endif %}
                  <li class="nav-item">
                    <a class="nav-link" href="{% url 'account:my_page' user.pk %}">Account</a>
                  </li>
                  <li class="nav-item">
                    <form method="post" action="{% url 'sortIT:toggle_darkmode' %}">
                      {% csrf_token %}
                      <input type="hidden" name="next" value="{{ request.path }}">
                      <button class="btn btn-sm mt-3 mt-sm-1" type="submit">
                        <img src="{% static 'dark-theme.svg' %}"
                             alt="theme"
                             style="max-height:20px">
                      </button>
                    </form>
                  </li>
                </ul>
                <span class="mx-3 nav-item">Signed in as {{ user.username }}</span>
              </div>
              <span class="mx-3">
                <form method="post" action="{% url 'account:logout' %}">
                  {% csrf_token %}
                  <button class="btn btn-outline-secondary" type="submit">Log out</button>
                </form>
              </span>
            {% endif %}
          </div>
        </nav>
      </header>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <footer>
        <div class="m-3"></div>
      </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
            integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
            crossorigin="anonymous"></script>
  </body>
</html>
